name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # tests/conftest.py's --network flag defaults to off, so this stays
      # fully offline -- no secrets/credentials needed in this workflow.
      - name: Run tests
        run: pytest tests/ -q
